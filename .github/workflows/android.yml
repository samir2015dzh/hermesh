name: android
# The Android app builds, and its unit tests pass, on every change (a tag's APK
# is release.yml's). The APK of each run is kept as an artifact, to install from.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
# No build names a server (they are given to others): the login page asks for it.
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: setup-java-cache
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # One readable line per cache, in the log and the run summary.
      - name: cache hit
        shell: bash
        run: |
          echo "cache hit, setup-java (gradle) in apk: ${{ steps.setup-java-cache.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the NDK, if the runner lacks it
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK"/ndk >/dev/null 2>&1 || yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724"
      # The app's own key (docs/android-app.md §6.1), from the secrets: every APK is
      # signed with it, so each version installs over the last.
      # A pull request from a fork, given no secrets, builds with a throwaway key.
      - name: the app's signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::warning::no ANDROID_KEYSTORE_BASE64 (a pull request from a fork is given no secrets): this APK is signed with a throwaway debug key and will not install over the app"
              exit 0
            fi
            echo "::error::the repository secret ANDROID_KEYSTORE_BASE64 is not set (docs/android-app.md §6.1)"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "AIDE_ANDROID_KEYSTORE=$RUNNER_TEMP/app.p12" >> "$GITHUB_ENV"
      - name: build and test
        env:
          AIDE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AIDE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AIDE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: VERSION="0.0.0-${GITHUB_SHA::8}" apps/android/scripts/build.sh
      - name: the APK's signature
        if: env.AIDE_ANDROID_KEYSTORE != ''
        run: apps/android/scripts/check-signature.sh apps/android/build/*.apk
      # The installed identity, read back from the APK itself (io.aide.android;
      # the debug build adds .debug).
      - name: the APK's application id
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2="$(ls -d "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump badging apps/android/build/*.apk | head -1 | tee badging.txt
          grep -q "^package: name='io.aide.android.debug'" badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aide-android-debug
          path: apps/android/build/*.apk

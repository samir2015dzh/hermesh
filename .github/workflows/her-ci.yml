name: her

# The her kernel (her/): its own Rust workspace, tested apart from the Go code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'her/**'
      - '.github/workflows/her-ci.yml'
  pull_request:
    paths:
      - 'her/**'
      - '.github/workflows/her-ci.yml'

permissions:
  contents: read

concurrency:
  group: her-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The PDFium release the document tests run against.
  PDFIUM_TAG: chromium/8076

defaults:
  run:
    working-directory: her

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The PPT and Word engines are a private repository (her/Cargo.toml): cargo fetches it with this token.
      - name: Read access to the NimbleOffice fork
        env:
          NIMBLEOFFICE_TOKEN: ${{ secrets.NIMBLEOFFICE_TOKEN }}
        run: |
          if [ -z "$NIMBLEOFFICE_TOKEN" ]; then
            echo "::warning::NIMBLEOFFICE_TOKEN is not set: cargo cannot fetch github.com/Eliseowzy/nimbleoffice"
            exit 0
          fi
          git config --global url."https://x-access-token:${NIMBLEOFFICE_TOKEN}@github.com/Eliseowzy/nimbleoffice".insteadOf "https://github.com/Eliseowzy/nimbleoffice"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      # Cargo's registry and her/target, kept between runs (deleted with her). Saved by main's
      # pushes alone: a pull request restores main's, and adds none to the cache quota.
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          workspaces: her -> target
          key: her-ci-test-${{ runner.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # One readable line per cache, in the log and the run summary.
      - name: cache hit
        shell: bash
        run: |
          echo "cache hit, rust-cache (rust) in test: ${{ steps.rust-cache.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: PDFium for the document tests
        run: |
          case "$RUNNER_OS" in
            Linux) archive=pdfium-linux-x64.tgz; lib=libpdfium.so ;;
            macOS) archive=pdfium-mac-arm64.tgz; lib=libpdfium.dylib ;;
          esac
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/$archive" | tar xz -C "$RUNNER_TEMP/pdfium"
          echo "HER_PDFIUM=$RUNNER_TEMP/pdfium/lib/$lib" >> "$GITHUB_ENV"
      - name: Rust tests, every crate
        run: cargo test --workspace --no-fail-fast
      - name: Word saved through the desktop app's serializer
        run: HER_WORD_SAVE=desktop cargo test -p her-server --lib docx_host -- --ignored
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The public build compiles and the generated reference is current
        run: |
          cargo check -p her-cli --no-default-features
          node tools/gen-protocol-docs.mjs --check
          sh tools/check-public.sh
      - name: Browser extension tests
        run: node --test apps/chrome-extension/src/*.test.js

  # Windows, being ported (docs/windows.md): its failures do not fail the run yet.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: her
    steps:
      - uses: actions/checkout@v4
      - name: Read access to the NimbleOffice fork
        env:
          NIMBLEOFFICE_TOKEN: ${{ secrets.NIMBLEOFFICE_TOKEN }}
        run: |
          if [ -z "$NIMBLEOFFICE_TOKEN" ]; then
            echo "::warning::NIMBLEOFFICE_TOKEN is not set: cargo cannot fetch github.com/Eliseowzy/nimbleoffice"
            exit 0
          fi
          git config --global url."https://x-access-token:${NIMBLEOFFICE_TOKEN}@github.com/Eliseowzy/nimbleoffice".insteadOf "https://github.com/Eliseowzy/nimbleoffice"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      # Cargo's registry and her/target, kept between runs (deleted with her). Saved by main's
      # pushes alone: a pull request restores main's, and adds none to the cache quota.
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          workspaces: her -> target
          key: her-ci-windows-${{ runner.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # One readable line per cache, in the log and the run summary.
      - name: cache hit
        shell: bash
        run: |
          echo "cache hit, rust-cache (rust) in windows: ${{ steps.rust-cache.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: PDFium for the document tests
        run: |
          # tar takes "D:" for a host's name: the folder as bash names it.
          dir="$(cygpath -u "$RUNNER_TEMP")/pdfium"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/pdfium-win-x64.tgz" | tar xz -C "$dir"
          echo "HER_PDFIUM=$(cygpath -w "$dir/bin/pdfium.dll")" >> "$GITHUB_ENV"
      # her-bench drives a service over Unix sockets and reads Unix's process accounting.
      - name: Rust tests, every crate but the benchmarks
        run: cargo test --workspace --exclude her-bench --no-fail-fast

  # PILOT (CI cache ticket, P2): sccache on the GitHub Actions cache in place of rust-cache,
  # timed against test's "Rust tests, every crate". Not the definitive line: its failures
  # do not fail the run, and this job goes (one commit reverted) whatever is decided.
  pilot-sccache:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Read access to the NimbleOffice fork
        env:
          NIMBLEOFFICE_TOKEN: ${{ secrets.NIMBLEOFFICE_TOKEN }}
        run: |
          if [ -z "$NIMBLEOFFICE_TOKEN" ]; then
            echo "::warning::NIMBLEOFFICE_TOKEN is not set: cargo cannot fetch github.com/Eliseowzy/nimbleoffice"
            exit 0
          fi
          git config --global url."https://x-access-token:${NIMBLEOFFICE_TOKEN}@github.com/Eliseowzy/nimbleoffice".insteadOf "https://github.com/Eliseowzy/nimbleoffice"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: PDFium for the document tests
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/pdfium-linux-x64.tgz" | tar xz -C "$RUNNER_TEMP/pdfium"
          echo "HER_PDFIUM=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: Rust tests, every crate
        run: cargo test --workspace --no-fail-fast
      - name: sccache hits
        if: always()
        run: sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

  # PILOT (CI cache ticket, P2): cargo-nextest in place of cargo test, on test's rust-cache
  # (restored only, never saved: same key as test's, so no cache of its own). Doc tests,
  # which nextest does not run, are a step of their own so the two add up to test's run.
  # Not the definitive line: its failures do not fail the run, and this job goes (one
  # commit reverted) whatever is decided.
  pilot-nextest:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read access to the NimbleOffice fork
        env:
          NIMBLEOFFICE_TOKEN: ${{ secrets.NIMBLEOFFICE_TOKEN }}
        run: |
          if [ -z "$NIMBLEOFFICE_TOKEN" ]; then
            echo "::warning::NIMBLEOFFICE_TOKEN is not set: cargo cannot fetch github.com/Eliseowzy/nimbleoffice"
            exit 0
          fi
          git config --global url."https://x-access-token:${NIMBLEOFFICE_TOKEN}@github.com/Eliseowzy/nimbleoffice".insteadOf "https://github.com/Eliseowzy/nimbleoffice"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          workspaces: her -> target
          key: her-ci-test-${{ runner.os }}-test
          add-job-id-key: false
          save-if: false
      - run: 'echo "cache hit, rust-cache (test''s) in pilot-nextest: ${{ steps.rust-cache.outputs.cache-hit }}"'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: PDFium for the document tests
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/pdfium-linux-x64.tgz" | tar xz -C "$RUNNER_TEMP/pdfium"
          echo "HER_PDFIUM=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: Rust tests, every crate (nextest)
        run: cargo nextest run --workspace --no-fail-fast
      - name: Doc tests, every crate
        run: cargo test --workspace --doc --no-fail-fast
